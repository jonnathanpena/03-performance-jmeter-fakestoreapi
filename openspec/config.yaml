schema: spec-driven

context: |
  Proyecto: Pruebas de Performance (Carga) para FakeStoreAPI + Analisis de resultados.
  Origen: Ejercicio de Performance - Reto QA Automation (Sofka).

  Objetivo de negocio:
    EJERCICIO 1 - Script de carga:
      Probar el servicio de login de FakeStoreAPI bajo carga sostenida.
      Endpoint: POST https://fakestoreapi.com/auth/login
      Datos: parametrizados desde CSV (5 usuarios).
      Criterios: >= 20 TPS, tiempo respuesta <= 1500ms, tasa error < 3%.
    EJERCICIO 2 - Analisis:
      Analizar los resultados del archivo textSummary.txt (k6) y el diagrama
      de VUs vs RPS, identificar hallazgos y generar InformeResultados.

  Stack tecnico:
    - Herramienta: Apache JMeter 5.6.x
    - Java: 21 (requerido por JMeter)
    - Test data: users.csv (5 usuarios parametrizados)
    - Plugins necesarios: JMeter base (no requiere plugins extra)
    - Ejecucion CLI: jmeter -n -t jmeter/test-plan.jmx -l results/results.jtl
      -e -o results/html-report/

  Estructura del proyecto:
    jmeter/
      test-plan.jmx           -> Plan de prueba JMeter (ejercicio 1)
      test-data/users.csv     -> Datos parametrizados de usuarios
    reports/
      InformeResultados.md    -> Analisis del textSummary.txt (ejercicio 2)
    results/                  -> Generado en ejecucion (.jtl + HTML report)
    readme.txt
    conclusiones.txt

  Datos de entrada (users.csv):
    user,passwd
    donero,ewedon
    kevinryan,kev02937@
    johnd,m38rmF$
    derek,jklg*_56
    mor_2314,83r5^_

  Criterios de aceptacion:
    - Test plan JMX ejecutable con JMeter CLI.
    - Al menos 20 hilos (TPS) configurados con rampa.
    - Response Assertion: status 200.
    - Duration Assertion: <= 1500ms.
    - InformeResultados.md con hallazgos basados en textSummary.txt real.

rules:
  proposal:
    - Enfocar en criterios de aceptacion medibles (TPS, P95, error rate).
  tasks:
    - Cada configuracion de JMeter es una tarea verificable con screenshot o JTL.
